      <stop offset="0%" stop-color="#180b2b"/>
      <stop offset="50%" stop-color="#2a124a"/>
      <stop offset="100%" stop-color="#120522"/>
    </linearGradient>
    <linearGradient id="mk-accent" x1="0%" y1="0%" x2="100%" y2="0%">
